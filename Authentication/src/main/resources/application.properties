spring.config.import=optional:file:.env[.properties]

spring.application.name=Authentication

spring.datasource.url=jdbc:postgresql://localhost:5432/microservice

spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


server.port=8081

# JWT properties
jwt.secret=${JWT_SECRET}

jwt.expiration=3600000
jwt.refreshExpiration=86400000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# =========================================================
#  Backend Logging
# =========================================================

logging.level.root=INFO

logging.level.com.auth=INFO
logging.level.com.user=INFO
logging.level.com.ecommerce.catalog=INFO
logging.level.com.orderservice=INFO
logging.level.com.Payment=INFO
logging.level.com.gatway=INFO
logging.level.com.dashboard=INFO

