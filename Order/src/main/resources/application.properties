# =========================================================
# APPLICATION
# =========================================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=Order

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8083}
server.address=0.0.0.0

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}

# =========================================================
# CATALOG SERVICE
# =========================================================
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8085}

# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---------------------------------------------------------
# Producer
# ---------------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ---------------------------------------------------------
# Consumer
# ---------------------------------------------------------
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.orderservice.order.event.PaymentCompletedEvent

# =========================================================
# ACTUATOR / MONITORING
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.health.enabled=true

# =========================================================
# RESILIENCE4J - CATALOG SERVICE
# =========================================================

# -------------------------
# Retry
# -------------------------
resilience4j.retry.instances.catalogRetry.max-attempts=3
resilience4j.retry.instances.catalogRetry.wait-duration=1s
resilience4j.retry.instances.catalogRetry.enable-exponential-backoff=true
resilience4j.retry.instances.catalogRetry.exponential-backoff-multiplier=2

# -------------------------
# Circuit Breaker
# -------------------------
resilience4j.circuitbreaker.instances.catalogService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.catalogService.sliding-window-size=5
resilience4j.circuitbreaker.instances.catalogService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.catalogService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.catalogService.automatic-transition-from-open-to-half-open-enabled=true

# =========================================================
# RESILIENCE4J ASPECT ORDER
# Retry must execute before Circuit Breaker
# =========================================================
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

# =========================================================
# BACKEND LOGGING
# =========================================================
logging.level.root=INFO

logging.level.com.auth=INFO
logging.level.com.user=INFO
logging.level.com.ecommerce.catalog=INFO
logging.level.com.orderservice=INFO
logging.level.com.Payment=INFO
logging.level.com.gatway=INFO
logging.level.com.dashboard=INFO