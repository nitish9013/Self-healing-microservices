# =========================================================
# APPLICATION
# =========================================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=Payment

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8084}
server.address=0.0.0.0

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# RAZORPAY
# =========================================================
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka listener startup is handled asynchronously
spring.kafka.listener.auto-startup=false
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.poll-timeout=3000

# Don't try to create Kafka topics on Render
spring.kafka.admin.auto-create=${KAFKA_ENABLED:false}

# =========================================================
# KAFKA SECURITY
# =========================================================
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

spring.kafka.properties.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_SSL_TRUSTSTORE_CERTIFICATES:}
spring.kafka.properties.ssl.endpoint.identification.algorithm=${KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:https}

# =========================================================
# KAFKA CONSUMER
# =========================================================
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.Payment.event.OrderCreatedEvent

# =========================================================
# KAFKA PRODUCER
# =========================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# =========================================================
# RESILIENCE4J RETRY
# =========================================================
resilience4j.retry.instances.paymentRetry.max-attempts=3
resilience4j.retry.instances.paymentRetry.wait-duration=2s

# =========================================================
# RESILIENCE4J CIRCUIT BREAKER
# =========================================================
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.wait-duration-in-open-state=20s

# =========================================================
# ACTUATOR / MONITORING
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.health.enabled=true

# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO

logging.level.com.auth=INFO
logging.level.com.user=INFO
logging.level.com.ecommerce.catalog=INFO
logging.level.com.orderservice=INFO
logging.level.com.Payment=INFO
logging.level.com.gatway=INFO
logging.level.com.dashboard=INFO