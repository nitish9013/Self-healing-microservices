#spring.config.import=optional:file:C:\Users\Nitish Kumar\OneDrive\Desktop\S.H.D.E.P_PROJECT\catalog/.env[.properties]
spring.config.import=optional:file:.env[.properties]

spring.application.name=catalog
server.port=8085


spring.datasource.url=jdbc:postgresql://localhost:5432/catalog_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# =========================================================
#  Backend Logging
# =========================================================

logging.level.root=INFO

logging.level.com.auth=INFO
logging.level.com.user=INFO
logging.level.com.ecommerce.catalog=INFO
logging.level.com.orderservice=INFO
logging.level.com.Payment=INFO
logging.level.com.gatway=INFO
logging.level.com.dashboard=INFO
