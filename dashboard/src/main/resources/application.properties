
spring.application.name=dashboard
server.port=8086


gateway.actuator.url=http://localhost:8080
auth.actuator.url=http://localhost:8081
user.actuator.url=http://localhost:8082
order.actuator.url=http://localhost:8083
payment.actuator.url=http://localhost:8084
catalog.actuator.url=http://localhost:8085
dashboard.actuator.url=http://localhost:8086

user.service.url=http://localhost:8082
catalog.service.url=http://localhost:8085
order.service.url=http://localhost:8083
payment.service.url=http://localhost:8084

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers, circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# these are for fallback method
resilience4j.circuitbreaker.instances.dashboardService.sliding-window-size=5
resilience4j.circuitbreaker.instances.dashboardService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dashboardService.wait-duration-in-open-state=10s


# these are for retry method
resilience4j.retry.instances.dashboardRetry.max-attempts=3
resilience4j.retry.instances.dashboardRetry.wait-duration=2s