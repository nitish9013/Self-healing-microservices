spring.config.import=optional:file:.env[.properties]

spring.application.name=dashboard

# =========================================================
# Server
# =========================================================

server.port=${PORT:8086}
server.address=0.0.0.0


# =========================================================
# Service URLs
# =========================================================

gateway.actuator.url=${GATEWAY_ACTUATOR_URL:http://localhost:8080}
auth.actuator.url=${AUTH_ACTUATOR_URL:http://localhost:8081}
user.actuator.url=${USER_ACTUATOR_URL:http://localhost:8082}
order.actuator.url=${ORDER_ACTUATOR_URL:http://localhost:8083}
payment.actuator.url=${PAYMENT_ACTUATOR_URL:http://localhost:8084}
catalog.actuator.url=${CATALOG_ACTUATOR_URL:http://localhost:8085}
dashboard.actuator.url=${DASHBOARD_ACTUATOR_URL:http://localhost:${PORT:8086}}

user.service.url=${USER_SERVICE_URL:http://localhost:8082}
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8085}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true


# =========================================================
# Resilience4j - Circuit Breaker
# =========================================================

resilience4j.circuitbreaker.instances.dashboardService.sliding-window-size=5
resilience4j.circuitbreaker.instances.dashboardService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dashboardService.wait-duration-in-open-state=10s


# =========================================================
# Resilience4j - Retry
# =========================================================

resilience4j.retry.instances.dashboardRetry.max-attempts=3
resilience4j.retry.instances.dashboardRetry.wait-duration=2s


# =========================================================
# Kafka Monitoring
# =========================================================

kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka.admin.request-timeout-ms=5000
kafka.admin.default-api-timeout-ms=5000


# =========================================================
# Backend Logging
# =========================================================

logging.level.root=INFO

logging.level.com.auth=INFO
logging.level.com.user=INFO
logging.level.com.ecommerce.catalog=INFO
logging.level.com.orderservice=INFO
logging.level.com.Payment=INFO
logging.level.com.gatway=INFO
logging.level.com.dashboard=INFO


# =========================================================
# Centralized Log Collection
# =========================================================

# Log file locations
# Paths are relative to Dashboard Service working directory

logs.auth=../authentication/logs/Authentication.json
logs.user=../users/logs/users.json
logs.catalog=../catalog/logs/catalog.json
logs.order=../order/logs/Order.json
logs.payment=../payment/logs/Payment.json
logs.gateway=../gateway/logs/gateway.json
logs.dashboard=logs/dashboard.json

# Maximum logs returned by centralized API
logs.max-results=500